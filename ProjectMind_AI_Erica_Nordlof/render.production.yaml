databases:
  - name: projectmind-postgres
    plan: basic-256mb
    databaseName: projectmind
    user: projectmind

services:
  - type: web
    name: projectmind-ai-production
    runtime: docker
    plan: starter
    rootDir: ProjectMind_AI_Erica_Nordlof
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: ProjectMind AI
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_SECURE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_REASONING_EFFORT
        value: max
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: projectmind-postgres
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: eu-central-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: SMART_CONTEXT_MAX_CHARS
        value: "180000"
      - key: SMART_MAX_FILE_CHARS
        value: "120000"
