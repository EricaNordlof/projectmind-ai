<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  {% if is_admin %}
  <header class="topbar">
    <a class="brand" href="/">
      <span class="logo">PM</span>
      <span><strong>ProjectMind AI</strong><small>AI · projekt · filer · versioner</small></span>
    </a>
    <nav>
      <a href="/">Projekt</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link-button" type="submit">Logga ut</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main class="{% block main_class %}shell{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
