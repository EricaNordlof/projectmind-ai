services:
  - type: web
    name: projectmind-ai
    runtime: docker
    plan: free

    rootDir: ProjectMind_AI_Erica_Nordlof
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    envVars:
      - key: APP_NAME
        value: ProjectMind AI
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_SECURE
        value: "true"

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_REASONING_EFFORT
        value: max

      - key: DATABASE_URL
        fromDatabase:
          name: projectmind-db
          property: connectionString

      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: eu-central-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"

      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_CHAT_IMAGE_MB
        value: "8"
      - key: MAX_CHAT_IMAGES
        value: "4"

databases:
  - name: projectmind-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
